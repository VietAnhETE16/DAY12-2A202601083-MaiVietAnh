[project]
name = "my-fastapi-app"
version = "0.1.0"
description = "A FastAPI application with Redis and Pydantic validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fakeredis>=2.21",
    "PyYAML>=6.0",
]
